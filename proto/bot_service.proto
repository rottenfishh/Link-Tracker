syntax = "proto3";

package bot;

option go_package = "proto/bot";

service BotService {
  rpc SendUpdate(LinkUpdate) returns (UpdateResponse);
}

message ChatID{
  int64 ID = 1;
}

message LinkUpdate{
  int64 id = 1;
  string link = 2;
  string description = 3;
  repeated int64 tgChatIDS = 4;
}

message UpdateResponse {
  string message = 1;
}